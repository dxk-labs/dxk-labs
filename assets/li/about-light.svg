<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="284" viewBox="0 0 800 284" role="img" aria-label="About"><defs></defs><rect x="0.5" y="0.5" width="799" height="283" rx="8" fill="#ffffff" stroke="#dcdad6"/><text x="24.0" y="44.0" font-family="-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#191919" text-anchor="start" >About</text><text x="24.0" y="76.0" font-family="-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start" >I build small, sharp tools for problems that annoy me, then ship them so they stop annoying everyone else.</text><text x="24.0" y="108.0" font-family="-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start" >So far that&#x27;s a sleep-schedule app, a couple of browser extensions, and a Windows utility you control by</text><text x="24.0" y="128.0" font-family="-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start" >slapping your laptop.</text><text x="24.0" y="160.0" font-family="-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start" >[ONE OR TWO LINES ABOUT WHAT YOU WANT NEXT, e.g. &quot;Looking for a summer internship in mobile or web.&quot;]</text><rect x="24" y="188.0" width="752" height="72" rx="8" fill="none" stroke="#dcdad6"/><g transform="translate(48.0 215.0)"><rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)" fill="none" stroke="#191919" stroke-width="1.6"/></g><text x="64.0" y="220.0" font-family="-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto