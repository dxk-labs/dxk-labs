name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4d7c0f&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212
            dist/snake-dark.svg?palette=github-dark&color_snake=#c3f73a&color_dots=#161b22,#2d3a12,#557a1a,#8cc425,#c3f73a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
